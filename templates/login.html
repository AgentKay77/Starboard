{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}

<div class="narrow">
  <div class="auth-head">
    <span class="smallcaps">{{ site_name }} · Sign in</span>
    <h1 class="serif">Welcome back</h1>
  </div>

  <form method="post" class="card">
    <div class="field">
      <label for="identifier">Email or username</label>
      <input id="identifier" type="text" name="identifier" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn primary lg block">Sign in</button>
  </form>

  <p class="center muted" style="margin-top: 18px; font-size: 13px;">
    No account? <a href="{{ url_for('auth.signup') }}" style="color: var(--accent-2)">Sign up</a>.
  </p>
</div>

{% endblock %}
