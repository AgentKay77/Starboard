{% extends "base.html" %}
{% block title %}Submit time{% endblock %}
{% block content %}

<div style="max-width: 540px; margin: 0 auto;" class="stack stack-24">
  <header class="page-h">
    <div>
      <span class="smallcaps">Daily Stars · Submission</span>
      <h1 class="serif">Submit time</h1>
      <p>Recompute is automatic on save — APR and current-week awards refresh in seconds.</p>
    </div>
  </header>

  <form method="post" id="submit-form" class="card">
    <div class="field">
      <label for="date">Puzzle date</label>
      <input id="date" type="date" name="date" required value="{{ default_date }}"
             {% if not current_user.is_admin %}min="{{ min_date }}" max="{{ max_date }}"{% endif %} />
    </div>

    <div class="field">
      <label for="player_id">Player</label>
      <select id="player_id" name="player_id" required>
        {% for p in players %}
          <option value="{{ p.id }}">{{ p.display_name or p.name }}</option>
        {% endfor %}
      </select>
    </div>

    <fieldset class="field" style="border: 0; padding: 0; margin-bottom: 16px;">
      <legend>Status</legend>
      <div class="toggle-group" style="margin-top: 6px;">
        <label><input type="radio" name="status" value="completed" id="status-completed" checked /><span>Completed</span></label>
        <label><input type="radio" name="status" value="dnf"       id="status-dnf" /><span>DNF</span></label>
      </div>
    </fieldset>

    <div class="field" id="time-field">
      <label for="time">Time</label>
      <input id="time" type="text" name="time" inputmode="numeric" pattern="[0-9:.]+"
             placeholder="1:42 or 102" class="num" />
      <span class="hint">Use <code>m:ss</code> or raw seconds. Decimal seconds work too.</span>
    </div>

    <button type="submit" class="btn primary lg block">Record</button>
  </form>
</div>

<script>
(function () {
  const dnf = document.getElementById('status-dnf');
  const timeField = document.getElementById('time-field');
  const timeInput = timeField.querySelector('input[name="time"]');
  function sync() {
    if (dnf.checked) {
      timeField.style.opacity = '0.4';
      timeField.style.pointerEvents = 'none';
      timeInput.required = false;
    } else {
      timeField.style.opacity = '';
      timeField.style.pointerEvents = '';
      timeInput.required = true;
    }
  }
  document.querySelectorAll('input[name="status"]').forEach((el) => el.addEventListener('change', sync));
  sync();
})();
</script>

{% endblock %}
